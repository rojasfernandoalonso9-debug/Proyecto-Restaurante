spring:
  application:
    name: restaurant-management-api
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/restaurant_management?serverTimezone=UTC}
    username: ${DB_USERNAME:restaurant_app}
    password: ${DB_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true

server:
  port: ${SERVER_PORT:8080}

app:
  jwt:
    secret: ${JWT_SECRET:}
    expiration-ms: ${JWT_EXPIRATION_MS:3600000}
